<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src https://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'"><title>Team workspace</title><link rel="stylesheet" href="./style.css"><script type="module" src="./app.js"></script></head>
<body><header><a href="./">Team workspace</a><button id="signout" hidden>Sign out</button></header><main><section id="login" class="card narrow"><p class="eyebrow">PRIVATE TEAM ACCESS</p><h1>One place to keep work moving.</h1><p>Use your @item.com company email address to register or sign in. Team access requires an invitation.</p><form id="email-form"><label>Company email address<input id="email" type="email" autocomplete="email" placeholder="you@item.com" pattern="[^@\s]+@[iI][tT][eE][mM]\.[cC][oO][mM]" title="Use your @item.com company email address" required></label><button>Send sign-in code</button></form><form id="code-form" hidden><label>Email code<input id="code" inputmode="numeric" autocomplete="one-time-code" required></label><button>Sign in</button></form></section><p id="message" role="status" aria-live="polite"></p><section id="workspace" hidden><p class="eyebrow">TEAM WORKSPACE</p><h1 id="title"></h1><p id="tagline"></p><div id="summary" class="summary"></div><section class="filters card" aria-label="Task filters"><label>Search<input id="search" type="search" placeholder="Task or notes"></label><label>Workstream<select id="category"><option value="">All workstreams</option></select></label><label>Assigned to<select id="owner"><option value="">Everyone</option></select></label><label>Status<select id="status"><option value="">All statuses</option></select></label><label>Priority<select id="priority"><option value="">All priorities</option></select></label><button id="refresh">Refresh</button></section><p id="sync" class="muted"></p><div id="tasks"></div></section></main><dialog id="editor"><form id="edit-form"><h2 id="edit-title"></h2><p id="acceptance"></p><label>Assigned to <span class="muted">(select one or more)</span><select id="edit-owners" multiple size="7"></select></label><div class="row"><label>Status<select id="edit-status"></select></label><label>Priority<select id="edit-priority"></select></label><label>Due date<input id="edit-due" type="date"></label></div><label>Progress / blockers<textarea id="edit-notes" maxlength="4000" rows="4"></textarea></label><p id="edit-message" role="status"></p><div class="actions"><button type="button" id="cancel">Cancel</button><button id="save">Save changes</button></div></form></dialog></body></html>
